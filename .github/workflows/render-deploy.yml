name: Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend App
        run: |
          curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
      
      - name: Deploy Frontend App
        run: |
          curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
